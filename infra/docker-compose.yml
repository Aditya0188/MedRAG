version: '3.8'

services:
  # Optional Qdrant Vector Database Container
  # Note: The MedDRAG backend already includes embedded local disk Qdrant engine,
  # so running this Docker container is strictly optional.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: meddrag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
